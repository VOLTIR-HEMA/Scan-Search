<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Just Scan Pricing</title>
    <style>
        :root {
            --main-blue: #3b82f6;
            --dark-bg: #0a0a0a;
            --neon-glow: 0 0 15px rgba(59, 130, 246, 0.5);
            --gold-glow: 0 0 15px rgba(234, 179, 8, 0.4);
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-y: auto;
        }

        .poster-container {
            width: 500px;
            min-height: 800px;
            height: auto;
            background-color: var(--dark-bg);
            border: 2px solid var(--main-blue);
            border-radius: 20px;
            position: relative;
            color: white;
            padding: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { width: 80px; filter: drop-shadow(var(--neon-glow)); }
        .app-name { font-size: 28px; color: var(--main-blue); font-weight: bold; letter-spacing: 2px; margin-top: 10px; }
        .headline { font-size: 22px; text-align: center; margin: 20px 0; line-height: 1.5; }

        .phone-mockup {
            width: 200px;
            height: 350px;
            border: 8px solid #333;
            border-radius: 30px;
            margin: 0 auto;
            background-image: url('app_ui.png');
            background-size: cover;
            box-shadow: var(--neon-glow);
        }

        .pricing { margin-top: 30px; text-align: center; }
        
        /* كروت الباقات العادية */
        .price-card { 
            background: rgba(59, 130, 246, 0.08); 
            border: 1px solid rgba(59, 130, 246, 0.4); 
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 12px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .plan-title { font-size: 18px; font-weight: 500; }
        .plan-cost { font-size: 20px; font-weight: bold; color: #e0e0e0; }

        /* كارت الباقة السنوية المميز */
        .price-card.featured {
            background: rgba(234, 179, 8, 0.05);
            border: 2px solid #eab308;
            box-shadow: var(--gold-glow);
            position: relative;
            padding: 18px 15px;
        }
        
        .badge {
            position: absolute;
            top: -12px;
            left: 20px;
            background: #eab308;
            color: black;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 20px;
        }

        .old-price { text-decoration: line-through; color: #ff4444; font-size: 15px; margin-left: 8px; }
        .new-price { font-size: 26px; font-weight: bold; color: #4ade80; }

        .footer {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 10px;
        }

        .qr-placeholder {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .qr-placeholder img { width: 90%; }

        .download-btn {
            background: var(--main-blue);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: var(--neon-glow);
            transition: 0.3s;
        }
        
        .download-btn:hover {
            background: #2563eb;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.8);
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <div class="header">
            <img src="logo.png" alt="Logo" class="logo">
            <div class="app-name">JUST SCAN</div>
        </div>
        <div class="headline">وفر وقتك، وفر فلوسك..<br><b>بديل السكانر المتكامل!</b></div>
        
        <div class="phone-mockup"></div>
        
        <div class="pricing">
            <div class="price-card">
                <span class="plan-title">باقة الـ 3 شهور</span>
                <span class="plan-cost">180 ج.م</span>
            </div>
            
            <div class="price-card">
                <span class="plan-title">باقة الـ 6 شهور</span>
                <span class="plan-cost">300 ج.م</span>
            </div>
            
            <div class="price-card featured">
                <div class="badge">العرض الأقوى (وفر أكتر من 30%)</div>
                <span class="plan-title" style="color: #eab308; font-weight: bold;">العرض السنوي (12 شهر)</span>
                <div>
                    <span class="old-price">720 ج.م</span> 
                    <span class="new-price">500 ج.م</span>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <div class="qr-section">
                <p style="font-size: 12px; margin-bottom: 5px;">امسح للتحميل</p>
                <a href="https://drive.google.com/drive/folders/1-86kpUVIE84WWXuRzJV-CAzo-6EPecGz?usp=drive_link" class="qr-placeholder"><img src="qr_code.png"></a>
            </div>
            <a href="https://drive.google.com/drive/folders/1-86kpUVIE84WWXuRzJV-CAzo-6EPecGz?usp=drive_link" class="download-btn">حمل التطبيق الآن</a>
        </div>
    </div>
</body>
</html>
