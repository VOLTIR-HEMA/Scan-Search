<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Scan Poster Design</title>
    <style>
        :root {
            --main-blue: #3b82f6;
            --dark-bg: #0a0a0a;
            --neon-glow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* التغيير هنا عشان يبدأ من فوق ويسمح بالنزول */
            min-height: 100vh;
            margin: 0;
            padding: 20px 0; /* مسافة عشان البوستر ميبقاش لازق في حواف الشاشة */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-y: auto; /* السماح بالسكول لو المحتوى كبير */
        }

        .poster-container {
            width: 90%; /* عرض مرن للموبايل */
            max-width: 450px; /* أقصى عرض عشان ميبقاش ضخم على الكمبيوتر */
            background-color: var(--dark-bg);
            border: 2px solid var(--main-blue);
            border-radius: 20px;
            position: relative;
            color: white;
            padding: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: auto; /* خليته يطول تلقائي على حسب الحاجة */
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { width: 80px; filter: drop-shadow(var(--neon-glow)); }
        
        .app-name { 
            font-size: 28px; 
            color: var(--main-blue); 
            font-weight: bold; 
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .headline {
            font-size: 20px;
            text-align: center;
            margin: 15px 0;
            line-height: 1.5;
        }

        .phone-mockup {
            width: 100%;
            max-width: 220px;
            aspect-ratio: 9/18.5; /* يحافظ على أبعاد الموبايل مهما كان العرض */
            border: 8px solid #333;
            border-radius: 30px;
            margin: 0 auto;
            background-image: url('app_ui.png');
            background-size: cover;
            background-position: center;
            box-shadow: var(--neon-glow);
        }

        .pricing {
            margin-top: 25px;
            text-align: center;
            width: 100%;
        }

        .price-card {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--main-blue);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .old-price { text-decoration: line-through; color: #ff4444; font-size: 14px; }
        .new-price { font-size: 24px; font-weight: bold; color: #4ade80; }

        /* تعديل منطقة الفوتر لتناسب الموبايل */
        .footer {
            margin-top: 20px;
            width: 100%;
            display: flex;
            flex-direction: column; /* فوق بعض في الموبايل عشان الزحمة */
            align-items: center;
            gap: 15px;
        }

        .qr-placeholder {
            width: 110px;
            height: 110px;
            background: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 5px;
        }

        .qr-placeholder img { width: 100%; height: 100%; }

        .download-btn {
            background: var(--main-blue);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            text-align: center;
        }

        .download-btn:hover { transform: scale(1.05); background: #2563eb; }

        /* لو الشاشة واسعة (كمبيوتر) خلي الباركود والزرار جنب بعض */
        @media (min-width: 400px) {
            .footer {
                flex-direction: row;
                justify-content: space-between;
                align-items: flex-end;
            }
        }
    </style>
</head>
<body>

    <div class="poster-container">
        <div class="header">
            <img src="logo.png" alt="Logo" class="logo">
            <div class="app-name">JUST SCAN</div>
        </div>

        <div class="headline">
            وفر وقتك، وفر فلوسك..<br>
            <b>بديل السكانر المتكامل!</b>
        </div>

        <div class="phone-mockup"></div>

        <div class="pricing">
            <div class="price-card">
